<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Theia has a new address</title>
<meta name="description" content="Theia's website now lives at theia-media.app.">
<link rel="canonical" href="https://theia-media.app/">
<noscript><meta http-equiv="refresh" content="0; url=https://theia-media.app/"></noscript>
<style>
  html { background: #0b0a09; color: #ede7dc; font: 400 1rem/1.65 system-ui, sans-serif; }
  body { margin: 0; min-block-size: 100vh; display: grid; place-items: center; padding: 2rem 1rem; box-sizing: border-box; }
  main { max-inline-size: 30rem; text-align: center; }
  .mark { margin: 0 0 1.5rem; font: 400 1.5rem/1 Georgia, serif; letter-spacing: 0.16em; text-transform: uppercase; }
  h1 { margin: 0 0 1rem; font-weight: 500; font-size: 1.5rem; line-height: 1.3; }
  p { margin: 0 0 1rem; color: #d6cfc2; }
  a { display: inline-block; min-block-size: 44px; line-height: 44px; padding-inline: 0.5rem; color: #e3c173; }
</style>
</head>
<body>
<main>
  <p class="mark" aria-hidden="true">Theia</p>
  <h1>Theia has a new address</h1>
  <p>The website now lives at theia-media.app. You are being taken there.</p>
  <p><a id="moved" href="https://theia-media.app/">Go to theia-media.app</a></p>
</main>
<script>
// Keeps the path, query and section of an old address on the new host. The host is
// fixed, so no address can send a visitor anywhere else.
(function () {
  var prefix = "/theia-media/";
  var path = location.pathname;
  path = path.indexOf(prefix) === 0 ? path.slice(prefix.length) : path.replace(/^\/+/, "");
  if (path === "index.html") path = "";
  var url = "https://theia-media.app/" + path.replace(/^\/+/, "") + location.search + location.hash;
  document.getElementById("moved").href = url;
  location.replace(url);
})();
</script>
</body>
</html>
