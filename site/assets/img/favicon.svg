<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The wordmark reduced to its first letter and its rule.

       Decision 52 chose "the word and the rule" as the identity: THEIA set in
       the display serif, underlined by a gold rule that reads as a horizon. At
       16px the word cannot fit, so what survives is the initial standing on the
       same rule. That is a crop of the lockup rather than a second mark
       invented beside it, which is what the previous sun icon was.

       The T is drawn as paths, never as a text element. A favicon is fetched as
       an image, so no webfont is available to it: a text node would silently
       fall back to whatever serif the platform happens to have, and the letter
       would differ on every machine.

       Never write a double hyphen in this file. XML forbids it inside a
       comment, and this icon carried two of them from M2 until v1.5.0. Nothing
       caught it: the file existed, the server returned it with the right
       content type, and injected into the page it rendered, because the HTML
       parser is lenient. A browser decoding it as an *image* uses a strict XML
       parser, so every tab silently fell back to the default icon for four
       releases. Loading it into an Image() and waiting for onload is the check
       that finds this; the file existing is not. -->

  <rect width="32" height="32" rx="7" fill="#0B0A09"/>

  <g fill="#EDE7DC">
    <!-- Crossbar, thin as a didone's horizontal. -->
    <path d="M6.4 7h19.2v2.5H6.4z"/>
    <!-- Bracket serifs hanging off each end of the crossbar. -->
    <path d="M6.4 7h1.9v3.6H6.4zM23.7 7h1.9v3.6h-1.9z"/>
    <!-- Stem, thick, and its foot serif. -->
    <path d="M14.4 7h3.2v14.1h-3.2z"/>
    <path d="M11.3 20.3h9.4v2.4h-9.4z"/>
  </g>

  <!-- The rule. The one gold thing on the mark, as in the lockup. -->
  <path d="M5.6 26.4h20.8" stroke="#C8A24A" stroke-width="2.4" stroke-linecap="round"/>
</svg>
