<div class="wrap faq-layout">
  <header class="faq-head page-head">
    <h1 id="page-title">{{t:faq.title}}</h1>
    <p class="lead">{{t:faq.intro}}</p>
    <div class="faq-help">
      <a class="btn btn-secondary" href="https://discord.gg/5E55F7XFZp">{{logo:discord}}{{t:help.discord}}</a>
      <a class="text-link" href="https://github.com/Benitoow/theia-media/issues/10">{{logo:github}}{{t:help.feedback}}{{icon:arrow:icon-arrow}}</a>
    </div>
  </header>
  <section id="faq" class="faq-list" aria-labelledby="page-title"><span id="ledger" class="anchor-alias"></span>{{block:faq}}</section>
</div>
