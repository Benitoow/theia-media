<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The wordmark reduced to its centre. A photographic crop of the logo turns
       to mush below about 64px, because the letterforms either side of the
       flare become an ambiguous cross, so the tab icon is the sun alone, drawn.
       Larger sizes use the real crop; see apple-touch-icon.png.

       Never write a double hyphen in this file. XML forbids it inside a
       comment, and this icon carried two of them from M2 until v1.5.0. Nothing
       caught it: the file existed, the server returned it with the right
       content type, and injected into the page it rendered, because the HTML
       parser is lenient. A browser decoding it as an *image* uses a strict XML
       parser, so every tab silently fell back to the default icon for four
       releases. Loading it into an Image() and waiting for onload is the check
       that finds this; the file existing is not. -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6E2"/>
      <stop offset="45%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#E8971F"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0B0A09"/>

  <!-- Rays: long on the horizontal, as in the lockup. -->
  <g stroke="#E8971F" stroke-linecap="round" fill="none">
    <path d="M2 16h7M23 16h7" stroke-width="1.6" opacity="0.95"/>
    <path d="M16 5v5M16 22v5" stroke-width="1.4" opacity="0.75"/>
    <path d="M8.2 8.2l3.2 3.2M20.6 20.6l3.2 3.2M23.8 8.2l-3.2 3.2M11.4 20.6l-3.2 3.2"
          stroke-width="1.2" opacity="0.55"/>
  </g>

  <circle cx="16" cy="16" r="5.4" fill="url(#core)"/>
</svg>
