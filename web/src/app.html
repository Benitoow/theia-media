<!doctype html>
<html lang="fr" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0b0a09" />
		<!-- Two files, one mark. Both are the initial standing on its rule, cut
		     from the same lockup as the navigation (decision 54). The SVG is what
		     tabs use and scales anywhere; the PNG exists only because iOS does
		     not take an SVG for a home-screen icon. -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="grain bg-ink text-bone antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
