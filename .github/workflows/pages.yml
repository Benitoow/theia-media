# Publishes site/ to GitHub Pages (decision 164). Manual: Actions > Pages > Run workflow.
# The address is site/site.config.json unless the repository variable SITE_URL is set.
# After each release, run node site/fetch-release.mjs and commit site/release.json.

name: Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['site/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # An empty SITE_URL falls back to site/site.config.json.
      - name: Build and check the page
        run: node site/build.mjs --check
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
