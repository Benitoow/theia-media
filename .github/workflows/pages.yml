name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - 'assets/social-preview.png'
      - 'web/static/favicon.svg'
      - 'web/static/apple-touch-icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # A release changes sizes, dates and digests without changing main. Rebuild
  # the site once the Release workflow has finished so the public metadata
  # follows the published binaries instead of waiting for another commit.
  workflow_run:
    workflows: ['Release']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy in flight is never cancelled: a half-published site is worse than a
# late one. A queued one is, because only the newest matters.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Only the two @fontsource-variable packages, which are the site's
      # runtime dependencies. Everything else in web/ is dev tooling the site
      # never touches.
      - run: npm ci --omit=dev
        working-directory: web

      # Metadata is fetched at build time only. The generated page performs no
      # GitHub API request and the committed release.json remains the offline
      # fallback for local, reproducible builds.
      - name: Read the latest published release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/fetch-release.mjs site/release.generated.json

      # Fails on catalogue drift, missing downloads or malformed metadata.
      - name: Build the French and English pages
        env:
          THEIA_RELEASE_JSON: site/release.generated.json
        run: node site/build.mjs

      - name: Check the generated site
        run: node site/check.mjs

      # include-hidden-files is not optional here: the action stopped shipping
      # dotfiles at v4, and site/build.mjs writes a .nojekyll that keeps Pages
      # from running the output through Jekyll.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
