# Publishes only the page that sends the old GitHub Pages address
# (benitoow.github.io/theia-media/) to theia-media.app, from site/legacy.
# The website itself is built and served by Cloudflare Pages from this repository
# (decision 164): it is not published from here. Manual: Actions > Pages > Run workflow.

name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/legacy
      - id: deployment
        uses: actions/deploy-pages@v5
