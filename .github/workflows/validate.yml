name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      # web-dist/ holds only its placeholder here, which is enough for
      # //go:embed to resolve. Nothing under test needs the real bundle.
      - run: go vet ./...
      - run: go test ./...

  interface:
    name: Interface guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # The guard drives a real browser against a real binary, because every
      # fault it exists to catch -- an overflowing layout, a refused font, a
      # target too small for a thumb -- renders a page that looks correct.
      - name: Build the binary the guard will drive
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o theia ./cmd/theia

      # Chromium only. The other two engines would triple the download for
      # assertions about geometry that do not differ between them.
      - run: npx playwright install --with-deps chromium
        working-directory: web

      # Node's own runner, no browser and no dependency. It covers the pure
      # parts the player was too large to let anybody test.
      - run: npm run test:unit
        working-directory: web

      - run: npm test
        working-directory: web

      - name: Play real generated media
        run: npm run test:playback
        working-directory: web

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: interface-guard-failures
          path: web/test-results/
          retention-days: 7
