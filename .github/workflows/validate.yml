name: Validate

# The Go contracts and the interface guard.
#
# The guard drives the bytes built by the Interface workflow, which the caller
# runs first in the same run: it downloads `embedded-web` instead of compiling
# the frontend a second time, so what it tests is what ships.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
      # web-dist/ holds only its placeholder here, which is enough for
      # //go:embed to resolve. Nothing under test needs the real bundle.
      - run: go vet ./...
      - run: go test ./...
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  interface:
    name: Interface guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The bytes the guard drives come from the Interface workflow, which the
      # caller ran first: the same artifact the six target builds embed.
      - uses: actions/download-artifact@v8
        with:
          name: embedded-web
          path: web-dist

      # npm ci is still needed here, for Playwright and the test harness.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      # The guard drives a real browser against a real binary, because every
      # fault it exists to catch -- an overflowing layout, a refused font, a
      # target too small for a thumb -- renders a page that looks correct.
      - name: Build the binary the guard will drive
        env:
          CGO_ENABLED: '0'
        run: go build -buildvcs=false -trimpath -o theia-server ./cmd/theia-server

      # Layout stays on Chromium, where it asserts geometry. Playback crosses
      # Chromium, stable Edge, Firefox and WebKit because MediaSource, codecs,
      # quotas and cancellation are precisely the parts that do differ.
      #
      # Four browsers are a few hundred megabytes and they change only when
      # Playwright does, which the lockfile pins. A miss costs what this step
      # always cost; a hit skips the download, and still installs the system
      # dependencies and still runs every suite.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium msedge firefox webkit
        working-directory: web

      # Node's own runner, no browser and no dependency. It covers the pure
      # parts the player was too large to let anybody test.
      - run: npm run test:unit
        working-directory: web

      - run: npm test
        working-directory: web

      - name: Play real generated media
        run: npm run test:playback
        working-directory: web

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: interface-guard-failures
          path: web/test-results/
          retention-days: 7
