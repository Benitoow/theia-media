name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release-gates:
    name: Update rollback and stream endurance
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      # These are deliberately release-only. Pull requests keep the fast unit
      # contracts; a tag pays for real process replacement and 100 real FFmpeg
      # cancellations before any distributable binary is built.
      - name: Exercise install, restart and unhealthy rollback
        run: go run ./scripts/verify-update

      - name: Build the endurance candidate
        env:
          CGO_ENABLED: '0'
        run: go build -buildvcs=false -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}-release-gate" -o theia-release-gate.exe ./cmd/theia-server

      - name: Exercise 100 cancellations and one complete stream
        run: go run ./scripts/verify-endurance -theia .\theia-release-gate.exe -cycles 100 -long-minutes 30 -port 8395

  build:
    needs: [validate, release-gates]
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true # a partial release is worse than none
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: '' }
          - { goos: linux, goarch: arm64, ext: '' }
          - { goos: darwin, goarch: amd64, ext: '' }
          - { goos: darwin, goarch: arm64, ext: '' }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: embedded-web
          path: web-dist

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      # The asset name is a contract with the updater: internal/updater builds
      # exactly this string to find its own binary, and TestAssetName pins it.
      # Renaming anything here produces an updater that silently never finds a
      # release.
      #
      # `theia-server-*` is decision 119. An installed v3.2 asks for
      # `theia-*` - it carries the old updater and cannot be taught otherwise -
      # so the same bytes are also staged under the old names while
      # THEIA_TRANSITIONAL_NAMES is 'true'. **Turning that off is the release
      # step that removes them**: do it in the release after the first V3.3,
      # and say so in the notes.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          THEIA_TRANSITIONAL_NAMES: 'true'
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          asset="theia-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -buildvcs=false -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.tmdbAPIKey=${TMDB_API_KEY}" \
            -o "dist/${asset}" \
            ./cmd/theia-server
          # Byte-identical copies under the names v3.2 installations look for.
          # GitHub reports a digest per asset, so the two names carry the same
          # digest and the old updater verifies the same bytes it would have.
          if [ "${THEIA_TRANSITIONAL_NAMES}" = "true" ]; then
            cp "dist/${asset}" "dist/theia-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          fi
          # The installer, on the same platforms. It carries no TMDB key: it
          # never talks to TMDB, and a key in a binary that gets downloaded by
          # people who already have a server is a key spent for nothing.
          go build -buildvcs=false -trimpath \
            -ldflags "-s -w -X main.version=${version}" \
            -o "dist/theia-setup-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            ./cmd/theia-setup
          ls -l dist

      # The binary has to actually run, and report the version it was tagged
      # with. Catching a broken build here costs a red pipeline; catching it
      # after publication costs everybody who updates into it.
      - name: Check the binary reports its version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          reported=$(./dist/theia-server-linux-amd64 -version)
          echo "reported: $reported"
          case "$reported" in
            *"${GITHUB_REF_NAME#v}"*) echo "version matches the tag" ;;
            *) echo "::error::binary reports '$reported', expected ${GITHUB_REF_NAME}" ; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: theia-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1

  # The player is a second toolchain - Rust, Node, and a 95 MB engine fetched by
  # digest - and it is built on Windows only. Not for convenience: Windows is the
  # only platform the player has been run and verified on (docs/v3.3.md), and a
  # macOS or Linux artifact would be a claim nobody has tested. Those arrive when
  # they can be validated, which is what the validation boundary says.
  player:
    name: Player (windows/amd64)
    needs: [validate, release-gates]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable

      # It caches the registry and the target directory, which is most of the
      # build time: a Tauri release build is a few hundred crates.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: player

      # The same script a maintainer runs. It builds the OSD first (tauri-build
      # embeds it), compiles the player, fetches the pinned engine - refusing
      # anything whose digest does not match - and lays out what ships.
      #
      # `-Version` reaches the player through the same ldflag mechanism the
      # server uses, so a bug report can name the build.
      - name: Build the player and its bundle
        env:
          CGO_ENABLED: '0'
        run: .\build-player.ps1 -Release -Bundle

      # A bundle without the engine plays nothing; one without the licence
      # breaches the LGPL that allows us to ship the engine at all. Both are
      # checked here rather than trusted, because both failures are silent.
      - name: Check the bundle is complete
        shell: pwsh
        run: |
          $dir = 'dist\theia-player-windows-amd64'
          foreach ($required in 'theia-player.exe', 'libmpv-2.dll', 'LICENSE-libmpv.txt', 'NOTICE.md') {
            if (-not (Test-Path (Join-Path $dir $required))) {
              Write-Error "the bundle is missing $required"
              exit 1
            }
          }
          $licence = Get-Content (Join-Path $dir 'LICENSE-libmpv.txt') -Raw
          if ($licence -notmatch 'GNU LESSER GENERAL PUBLIC LICENSE') {
            Write-Error 'the licence file does not contain the LGPL text'
            exit 1
          }
          Get-ChildItem $dir | Select-Object Name, Length

      # And the archive a person downloads: decision 121. It is assembled from
      # the pieces built above, so it cannot drift from them - the server and
      # installer are rebuilt here at the tagged version, and the player bundle
      # is the one just checked.
      - name: Assemble the one-file download
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\build-release.ps1 -Version $version -SkipPlayer
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check the archive holds everything
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $dir = "dist\theia-$version-windows-amd64"
          foreach ($required in 'theia-setup.exe', 'theia-server.exe', 'theia-player.exe',
                                'libmpv-2.dll', 'LICENSE-libmpv.txt', 'NOTICE.md', 'START-HERE.txt') {
            if (-not (Test-Path (Join-Path $dir $required))) {
              Write-Error "the archive is missing $required"
              exit 1
            }
          }
          # The server inside must report the tag it was built from, or the
          # archive contains a build nobody can identify.
          $reported = & (Join-Path $dir 'theia-server.exe') -version
          Write-Host "archive server reports: $reported"
          if ($reported -notmatch [regex]::Escape($version)) {
            Write-Error "the archive's server reports '$reported', expected $version"
            exit 1
          }
          Get-ChildItem $dir | Select-Object Name, Length

      # And the player has to run, from the bundle, with the engine it was
      # shipped with. This is the check that would have caught an unpinned
      # download, a truncated DLL, or a build that only worked on the machine
      # that made it.
      - name: Check the bundled player starts and names its engine
        shell: pwsh
        run: |
          $dir = (Resolve-Path 'dist\theia-player-windows-amd64').Path
          $log = Join-Path $env:TEMP 'player-start.log'
          $process = Start-Process -FilePath (Join-Path $dir 'theia-player.exe') `
            -ArgumentList '--mute', '--diagnostics' -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          Start-Sleep -Seconds 12
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          $pin = Select-String -Path $log -Pattern '^engine-pin: ' | Select-Object -First 1
          if (-not $pin) { Write-Error 'the player never printed its engine pin'; Get-Content $log; exit 1 }
          $json = ($pin.Line -replace '^engine-pin: ', '') | ConvertFrom-Json
          Write-Host "engine loaded: $($json.loaded)"
          Write-Host "pinned:        $($json.library) sha256:$($json.library_sha256)"
          if (-not $json.loaded) { Write-Error 'the bundled player loaded no engine'; exit 1 }
          if ($json.library_sha256 -ne '6f059354c5c45b41192cc52d867d94c0044edb48207c4efd2ea1244208c55359') {
            Write-Error "the player reports an unexpected engine digest: $($json.library_sha256)"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: theia-release-windows-amd64
          # Both zips: the archive a person downloads, and the player alone for
          # anybody who wants only that.
          path: |
            dist/theia-*-windows-amd64.zip
            dist/theia-player-windows-amd64.zip
          retention-days: 1

  publish:
    name: Publish the release
    needs: [build, player]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: staging
          pattern: theia-*
          merge-multiple: true

      - name: List what will be published
        run: ls -l staging

      # No separate checksum file: GitHub reports a sha256 digest for every
      # uploaded asset through its API, and that is what the updater verifies
      # against before it will install anything.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Theia ${GITHUB_REF_NAME}" \
            --notes-file docs/releases/${GITHUB_REF_NAME}.md \
            staging/theia-*
