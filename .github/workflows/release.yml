name: Release

on:
  push:
    tags: ['v*']
  # A dispatch runs every gate and builds every artifact without publishing
  # anything: `publish` refuses anything that is not a pushed tag. It is how a
  # change to this file is tried before it meets a tag, and how the pipeline's
  # own timing is measured.
  workflow_dispatch:

# The version every job names its artifacts after. On a pushed tag it is the
# tag; on a dispatch - which publishes nothing - it is 0.0.0, so the artifacts
# and the surface guard agree and a dry run proves the pipeline without claiming
# a release number.
env:
  THEIA_VERSION: ${{ github.event_name == 'push' && github.ref_name || '0.0.0' }}

permissions:
  contents: write

jobs:
  # The interface is built on its own so a release no longer waits eight minutes
  # of browser tests before it can compile a binary: the artifact is ready in
  # about a minute, and the guard keeps running beside everything else.
  interface:
    uses: ./.github/workflows/interface.yml

  validate:
    uses: ./.github/workflows/validate.yml
    needs: interface

  release-gates:
    name: Update rollback and stream endurance
    # No `needs` on purpose: the gates run beside the builds now. Nothing is
    # published unless every one of them passes - `publish` states that in one
    # place - so the old "before any distributable binary is built" order bought
    # serial time and nothing else. What it cost when a gate fails: a built
    # player on a runner, unspent.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      # These are deliberately release-only. Pull requests keep the fast unit
      # contracts; a tag pays for real process replacement and 100 real FFmpeg
      # cancellations, on the same tree the binaries are being built from.
      - name: Exercise install, restart and unhealthy rollback
        run: go run ./scripts/verify-update

      - name: Build the endurance candidate
        env:
          CGO_ENABLED: '0'
        run: go build -buildvcs=false -trimpath -ldflags "-s -w -X main.version=${{ env.THEIA_VERSION }}-release-gate" -o theia-release-gate.exe ./cmd/theia-server

      - name: Exercise 100 cancellations and one complete stream
        run: go run ./scripts/verify-endurance -theia .\theia-release-gate.exe -cycles 100 -long-minutes 30 -port 8395

  build:
    # Only the artifact: the guard and the gates are running while this builds.
    needs: interface
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true # a partial release is worse than none
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: '' }
          - { goos: linux, goarch: arm64, ext: '' }
          - { goos: darwin, goarch: amd64, ext: '' }
          - { goos: darwin, goarch: arm64, ext: '' }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: embedded-web
          path: web-dist

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      # The asset name is a contract with the updater: internal/updater builds
      # exactly this string to find its own binary, and TestAssetName pins it.
      # Renaming anything here produces an updater that silently never finds a
      # release.
      #
      # `theia-server-*` is decision 119. V3.3.0 carried byte-identical copies
      # under the old `theia-*` names so an installed v3.2 could cross the
      # rename. That one-release bridge is deliberately gone in V3.3.1.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          version="${THEIA_VERSION}"
          mkdir -p dist
          asset="theia-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -buildvcs=false -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.tmdbAPIKey=${TMDB_API_KEY}" \
            -o "dist/${asset}" \
            ./cmd/theia-server
          # Only the platforms whose *whole* product has been run on real
          # hardware publish a setup program: publishing one for a target with no
          # player made five of them look like complete products when they are
          # not (decision 138). V3.3.4 adds macOS Apple Silicon, whose player is
          # built on a macOS runner below.
          case "${{ matrix.goos }}/${{ matrix.goarch }}" in
            windows/amd64)
              go build -buildvcs=false -trimpath \
                -ldflags "-s -w -X main.version=${version}" \
                -o "dist/theia-setup-windows-amd64.exe" \
                ./cmd/theia-setup
              # The `theia` command: windowed, because it is what the product's
              # Start Menu entry starts and a console build would flash a black
              # rectangle on every click. The published name says what it is; the
              # installed one is `theia.exe` (internal/release.LauncherName).
              go build -buildvcs=false -trimpath \
                -ldflags "-s -w -H=windowsgui -X main.version=${version}" \
                -o "dist/theia-launcher-windows-amd64.exe" \
                ./cmd/theia
              ;;
            darwin/arm64)
              # No -H=windowsgui and no .exe: the macOS command is an ordinary
              # executable, and `open` is what the launcher uses to start the
              # player's app bundle.
              go build -buildvcs=false -trimpath \
                -ldflags "-s -w -X main.version=${version}" \
                -o "dist/theia-setup-darwin-arm64" \
                ./cmd/theia-setup
              go build -buildvcs=false -trimpath \
                -ldflags "-s -w -X main.version=${version}" \
                -o "dist/theia-launcher-darwin-arm64" \
                ./cmd/theia
              ;;
          esac
          ls -l dist

      # The binary has to actually run, and report the version it was tagged
      # with. Catching a broken build here costs a red pipeline; catching it
      # after publication costs everybody who updates into it.
      - name: Check the binary reports its version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          reported=$(./dist/theia-server-linux-amd64 -version)
          echo "reported: $reported"
          case "$reported" in
            *"${THEIA_VERSION#v}"*) echo "version matches the tag" ;;
            *) echo "::error::binary reports '$reported', expected ${THEIA_VERSION}" ; exit 1 ;;
          esac

      # A Windows binary cannot be started on this runner, so what it carries is
      # read out of the file. `/_app/` is the built application's own asset
      # path: 75 occurrences in the published server, none in one compiled
      # without web-dist - which is what fault 14 shipped in the offline bundle.
      # The player job asks the archive's copy the same question by running it.
      - name: Check the Windows server carries the built interface
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes('dist/theia-server-windows-amd64.exe')
          $text = [System.Text.Encoding]::GetEncoding('iso-8859-1').GetString($bytes)
          if ($text.IndexOf('/_app/') -lt 0) {
            Write-Error 'the server carries no interface: web-dist held no application when it was built'
            exit 1
          }
          Write-Host 'the Windows server carries the built interface'

      - uses: actions/upload-artifact@v7
        with:
          name: theia-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1

  # The player is a second toolchain - Rust, Node, and a 95 MB engine fetched by
  # digest - and it is built on Windows only. Not for convenience: Windows is the
  # only platform the player has been run and verified on (docs/v3.3.md), and a
  # macOS or Linux artifact would be a claim nobody has tested. Those arrive when
  # they can be validated, which is what the validation boundary says.
  player:
    name: Player (windows/amd64)
    # Only the artifact, like the build matrix above.
    needs: interface
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The interface is an artifact, not a source file, and this job is where
      # the archive is assembled: without this download, the server inside it is
      # compiled with nothing but web-dist/.gitkeep. That is fault 14 - four
      # releases shipped a bundle whose server answered 503 with the "frontend
      # not built" placeholder.
      - uses: actions/download-artifact@v8
        with:
          name: embedded-web
          path: web-dist

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable

      # It caches the registry and the target directory, which is most of the
      # build time: a Tauri release build is a few hundred crates.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: player

      # The same script a maintainer runs. It builds the OSD first (tauri-build
      # embeds it), compiles the player, fetches the pinned engine - refusing
      # anything whose digest does not match - and lays out what ships.
      #
      # `-Version` reaches the player through build.rs, which compiles the tag
      # into the binary so --diagnostics names the build a bug report came from.
      - name: Build the player and its bundle
        env:
          CGO_ENABLED: '0'
        run: .\build-player.ps1 -Release -Bundle -Version ${{ env.THEIA_VERSION }}

      # A bundle without the engine plays nothing; one without the licence
      # breaches the LGPL that allows us to ship the engine at all. Both are
      # checked here rather than trusted, because both failures are silent.
      - name: Check the bundle is complete
        shell: pwsh
        run: |
          $dir = 'dist\theia-player-windows-amd64'
          foreach ($required in 'theia-player.exe', 'libmpv-2.dll', 'LICENSE-libmpv.txt', 'NOTICE.md') {
            if (-not (Test-Path (Join-Path $dir $required))) {
              Write-Error "the bundle is missing $required"
              exit 1
            }
          }
          $licence = Get-Content (Join-Path $dir 'LICENSE-libmpv.txt') -Raw
          if ($licence -notmatch 'GNU LESSER GENERAL PUBLIC LICENSE') {
            Write-Error 'the licence file does not contain the LGPL text'
            exit 1
          }
          Get-ChildItem $dir | Select-Object Name, Length

      # And the archive a person downloads: decision 121. The server and the
      # installer are rebuilt here at the tagged version, and the player bundle
      # is the one just checked - and "rebuilt here" is exactly why this step
      # needs the interface downloaded above and the key below: a rebuild takes
      # what this job has, not what the build job had. Fault 14.
      - name: Assemble the one-file download
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          # The same secret the build job injects into the published server.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          $version = '${{ env.THEIA_VERSION }}'.TrimStart('v')
          .\build-release.ps1 -Version $version -SkipPlayer
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check the archive holds everything
        shell: pwsh
        run: |
          $version = '${{ env.THEIA_VERSION }}'.TrimStart('v')
          $dir = "dist\theia-$version-windows-amd64"
          foreach ($required in 'theia-setup.exe', 'theia-server.exe', 'theia-player.exe', 'theia.exe',
                                'libmpv-2.dll', 'LICENSE-libmpv.txt', 'NOTICE.md', 'START-HERE.txt') {
            if (-not (Test-Path (Join-Path $dir $required))) {
              Write-Error "the archive is missing $required"
              exit 1
            }
          }
          # The server inside must report the tag it was built from, or the
          # archive contains a build nobody can identify.
          $reported = & (Join-Path $dir 'theia-server.exe') -version
          Write-Host "archive server reports: $reported"
          if ($reported -notmatch [regex]::Escape($version)) {
            Write-Error "the archive's server reports '$reported', expected $version"
            exit 1
          }
          # And the launcher is run the way Windows would run it - started and
          # waited for, with its output redirected - because it is a windowed
          # build: a subsystem or console-attach mistake would print nothing at
          # all, and the Start Menu entry that starts it would look like a
          # program that does nothing.
          $launcherLog = Join-Path $env:TEMP 'theia-launcher-version.log'
          Start-Process -FilePath (Join-Path $dir 'theia.exe') -ArgumentList '-version' `
            -Wait -NoNewWindow -RedirectStandardOutput $launcherLog
          $launcherSaid = (Get-Content $launcherLog -Raw).Trim()
          Write-Host "archive launcher reports: $launcherSaid"
          if ($launcherSaid -notmatch [regex]::Escape($version)) {
            Write-Error "the archive's launcher reports '$launcherSaid', expected $version"
            exit 1
          }
          Get-ChildItem $dir | Select-Object Name, Length

      # Reporting a version is not being the product, and this server is built
      # in this job: the two things it cannot take from the source are the
      # interface and the metadata key, and both went missing here for four
      # releases (fault 14). The check reads them back from a running process -
      # /api/health proves it started, / answers with the interface rather than
      # the 503 placeholder, and the log names the key source it resolved.
      - name: Check the archived server serves the interface and carries the key
        shell: pwsh
        run: |
          $version = '${{ env.THEIA_VERSION }}'.TrimStart('v')
          $dir = (Resolve-Path "dist\theia-$version-windows-amd64").Path
          $port = 8397
          $dataDir = Join-Path $env:TEMP 'theia-archive-server-check'
          Remove-Item $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          $log = Join-Path $env:TEMP 'theia-archive-server.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $server = Start-Process -FilePath (Join-Path $dir 'theia-server.exe') `
            -ArgumentList '-data-dir', $dataDir, '-port', $port -PassThru -NoNewWindow `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          try {
            $client = [System.Net.Http.HttpClient]::new()
            $client.Timeout = [TimeSpan]::FromSeconds(10)
            $health = $null
            for ($second = 0; $second -lt 60 -and -not $health; $second++) {
              Start-Sleep -Seconds 1
              try { $health = $client.GetStringAsync("http://127.0.0.1:$port/api/health").Result } catch { }
            }
            if (-not $health) { Write-Error 'the archived server never answered /api/health'; exit 1 }
            $page = $client.GetAsync("http://127.0.0.1:$port/").Result
            $body = $page.Content.ReadAsStringAsync().Result
            if (-not $page.IsSuccessStatusCode -or $body -notmatch '<html') {
              Write-Error "the archived server answered $([int]$page.StatusCode) for / - the interface is not in this build"
              exit 1
            }
            if ((Get-Content $log -Raw) -notmatch 'TMDB metadata enabled') {
              Write-Error 'the archived server has no built-in TMDB key'
              exit 1
            }
            Write-Host 'the archived server serves the interface and carries the metadata key'
          }
          finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      # And the player has to run, from the bundle, with the engine it was
      # shipped with. This is the check that would have caught an unpinned
      # download, a truncated DLL, or a build that only worked on the machine
      # that made it.
      - name: Check the bundled player starts, names its build and names its engine
        shell: pwsh
        run: |
          $dir = (Resolve-Path 'dist\theia-player-windows-amd64').Path
          $log = Join-Path $env:TEMP 'player-start.log'
          $err = "$log.err"
          $process = Start-Process -FilePath (Join-Path $dir 'theia-player.exe') `
            -ArgumentList '--mute', '--diagnostics' -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError $err
          # Wait for the line, not for a clock. The player loads a 100 MB engine
          # and opens a WebView2 window on a runner that boots cold, and the
          # first v3.3.2 attempt failed here after a fixed twelve seconds with an
          # empty stdout log: a statement about the wait, not about the player.
          # Ninety seconds is a ceiling reached only by a player that is not
          # going to print anything at all.
          $pin = $null
          for ($second = 0; $second -lt 90 -and -not $pin; $second++) {
            Start-Sleep -Seconds 1
            if (Test-Path $log) {
              $pin = Select-String -Path $log -Pattern '^engine-pin: ' | Select-Object -First 1
            }
          }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          if (-not $pin) {
            Write-Error 'the player never printed its engine pin within ninety seconds'
            if (Test-Path $log) { Write-Host '--- stdout ---'; Get-Content $log }
            if (Test-Path $err) { Write-Host '--- stderr ---'; Get-Content $err }
            exit 1
          }
          $json = ($pin.Line -replace '^engine-pin: ', '') | ConvertFrom-Json
          Write-Host "engine loaded: $($json.loaded)"
          Write-Host "pinned:        $($json.library) sha256:$($json.library_sha256)"
          if (-not $json.loaded) { Write-Error 'the bundled player loaded no engine'; exit 1 }
          if ($json.library_sha256 -ne '6f059354c5c45b41192cc52d867d94c0044edb48207c4efd2ea1244208c55359') {
            Write-Error "the player reports an unexpected engine digest: $($json.library_sha256)"
            exit 1
          }
          # And it has to name the build it came from. The engine pin says which
          # library is loaded; it does not say which Theia is drawing the
          # picture, and 'dev' here means the tag never reached build.rs - the
          # failure this check exists to catch, because it is silent otherwise.
          $build = Select-String -Path $log -Pattern '^theia-player: version ' | Select-Object -First 1
          if (-not $build) { Write-Error 'the player never printed its build version'; Get-Content $log; exit 1 }
          $reported = $build.Line -replace '^theia-player: version ', ''
          Write-Host "build:         $reported"
          if ($reported -ne '${{ env.THEIA_VERSION }}') {
            Write-Error "the player reports build '$reported', expected ${{ env.THEIA_VERSION }}"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: theia-release-windows-amd64
          # Both zips: the archive a person downloads, and the player alone for
          # anybody who wants only that.
          path: |
            dist/theia-*-windows-amd64.zip
            dist/theia-player-windows-amd64.zip
          retention-days: 1

  # The macOS player. Its own runner because it needs a macOS SDK to link, and
  # its own script because the two platforms ship different shapes: an app bundle
  # whose engine is a set of dylibs, rather than four files in a folder.
  player-macos:
    name: Player (darwin/arm64)
    needs: interface
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: player

      # The same script a maintainer runs on their own Mac: the OSD first
      # (tauri-build embeds it), then cargo with an rpath that reaches
      # Contents/Frameworks, then the pinned engine by digest, then the bundle,
      # an ad-hoc signature and the zip.
      - name: Build the player and its app bundle
        run: ./scripts/build-player-macos.sh -Release -Bundle -Version ${{ env.THEIA_VERSION }}

      # A bundle without its engine plays nothing, and one without the licence
      # breaches the LGPL that allows us to ship the engine at all. Both are
      # checked rather than trusted, because both failures are silent.
      - name: Check the bundle is complete
        run: |
          app='dist/theia-player-darwin-arm64/Theia.app'
          test -x "$app/Contents/MacOS/theia-player" || { echo 'the bundle holds no executable'; exit 1; }
          count=$(ls "$app/Contents/Frameworks"/*.dylib 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -lt 18 ]; then echo "only $count dylibs: the engine is incomplete"; exit 1; fi
          for required in \
            'Contents/Frameworks/libmpv.2.dylib' \
            'Contents/Resources/LICENSE-libmpv.txt' \
            'Contents/Resources/NOTICE.md' \
            'Contents/Resources/licenses/mpv-LICENSE.LGPL'
          do
            test -e "$app/$required" || { echo "the bundle is missing $required"; exit 1; }
          done
          echo "bundle version: $(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")"
          codesign --verify --strict "$app"
          du -sm "$app"

      # The engine pin says which library is loaded; the build version says which
      # Theia is drawing the picture. The second is the silent one: 'dev' here
      # means the tag never reached build.rs.
      - name: Check the player names its build and its engine
        run: |
          app='dist/theia-player-darwin-arm64/Theia.app'
          "$app/Contents/MacOS/theia-player" -version
          log=$(mktemp)
          "$app/Contents/MacOS/theia-player" --mute --diagnostics >"$log" 2>&1 &
          pid=$!
          pin=''
          for _ in $(seq 1 90); do
            sleep 1
            pin=$(grep -m1 '^engine-pin: ' "$log" || true)
            [ -n "$pin" ] && break
          done
          kill "$pid" 2>/dev/null || true
          if [ -z "$pin" ]; then echo 'the player never printed its engine pin'; cat "$log"; exit 1; fi
          echo "$pin"
          # `loaded` is the version string the *loaded library* reports - the
          # observation, not the claim - so it is read as JSON and required to be
          # non-empty. The first version of this line grepped for `"loaded": true`,
          # which the field has never been: measured on the Windows player, the
          # same field reads "mpv v0.41.0-1049-g0b7ed670f". The check could not
          # pass whatever the engine did.
          echo "$pin" | python3 -c '
import json, sys
pin = json.loads(sys.stdin.read().removeprefix("engine-pin: "))
loaded = pin.get("loaded")
if not loaded:
    print("the player loaded no engine (loaded=%r)" % (loaded,))
    sys.exit(1)
print("engine loaded:", loaded)
' || { cat "$log"; exit 1; }
          echo "$pin" | grep -q '028e5c8aaf035cd6d8db0e6d02061c81655e4ebf6dfbd54e2c7b917c02c60e3e' ||
            { echo 'the player reports an unexpected engine digest'; exit 1; }
          grep -m1 '^theia-player: version ' "$log" | grep -qF '${{ env.THEIA_VERSION }}' ||
            { echo 'the player does not report the tagged build'; cat "$log"; exit 1; }
          echo 'the bundle names its engine and its build'

      - uses: actions/upload-artifact@v7
        with:
          name: theia-player-darwin-arm64
          path: dist/theia-player-darwin-arm64.zip
          retention-days: 1

  # The macOS one-file download: everything in one archive, assembled rather than
  # built, exactly as the Windows one is (decision 121). The player comes from the
  # macOS runner; the three Go programs come from the build matrix, which already
  # cross-compiles them for darwin/arm64.
  package-macos:
    name: The macOS one-file download
    needs: [build, player-macos]
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: theia-server-darwin-arm64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: theia-player-darwin-arm64
          path: dist

      # The player travels zipped because an artifact does not promise to keep a
      # bundle's symlinks and executable bits. ditto is what recreates them.
      - name: Unpack the player bundle
        run: |
          mkdir -p dist/theia-player-darwin-arm64
          ditto -x -k dist/theia-player-darwin-arm64.zip dist/theia-player-darwin-arm64

      - name: Assemble the archive
        run: pwsh ./build-release.ps1 -Version ${{ env.THEIA_VERSION }} -Target darwin-arm64

      - name: Check the archive holds everything
        run: |
          version='${{ env.THEIA_VERSION }}'
          version="${version#v}"
          dir="dist/theia-${version}-darwin-arm64"
          for required in \
            'Theia.app/Contents/MacOS/theia-player' \
            'Theia.app/Contents/Frameworks/libmpv.2.dylib' \
            'Theia.app/Contents/Resources/licenses/mpv-LICENSE.LGPL' \
            'theia-server' 'theia-setup' 'theia' 'START-HERE.txt'
          do
            test -e "$dir/$required" || { echo "the archive is missing $required"; exit 1; }
          done
          # The server inside must report the tag it was built from, or the
          # archive holds a build nobody can identify.
          "$dir/theia-server" -version
          "$dir/Theia.app/Contents/MacOS/theia-player" -version
          du -sm "$dir"

      - uses: actions/upload-artifact@v7
        with:
          name: theia-release-darwin-arm64
          path: dist/theia-*-darwin-arm64.zip
          retention-days: 1

  # The exact public release surface, checked on every run of this file - a
  # dispatch included. It used to live inside `publish`, which a dispatch skips,
  # so the one guard that says whether the fourteen names are right could only
  # ever be tried by publishing something. What a dry run is for is exactly this.
  surface:
    name: Check the exact public release surface
    needs: [build, player, player-macos, package-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: staging
          pattern: theia-*
          merge-multiple: true

      - name: Check the exact public release surface
        shell: pwsh
        run: |
          $version = '${{ env.THEIA_VERSION }}'.TrimStart('v')
          ./scripts/check-release-assets.ps1 -Directory staging -Version $version

  publish:
    name: Publish the release
    # Every gate, explicitly: the jobs no longer chain through each other, so
    # this is the one place that says what a release requires.
    needs: [validate, release-gates, build, player, player-macos, package-macos, surface]
    # A dispatch measures the pipeline; only a pushed tag publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: staging
          pattern: theia-*
          merge-multiple: true

      # No separate checksum file: GitHub reports a sha256 digest for every
      # uploaded asset through its API, and that is what the updater verifies
      # against before it will install anything.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "Theia ${GITHUB_REF_NAME}" \
            --notes-file docs/releases/${GITHUB_REF_NAME}.md \
            "staging/theia-setup-windows-amd64.exe#DOWNLOAD — Theia ${version} for Windows x64" \
            "staging/theia-${version}-windows-amd64.zip#OFFLINE — Complete Windows x64 bundle" \
            "staging/theia-player-windows-amd64.zip#Component — Windows x64 player bundle (installer-managed)" \
            "staging/theia-launcher-windows-amd64.exe#Component — Windows x64 theia command (installer-managed)" \
            "staging/theia-server-windows-amd64.exe#Component — Windows x64 server (updater-managed)" \
            "staging/theia-server-windows-arm64.exe#Component — Windows ARM64 server (updater-managed)" \
            "staging/theia-server-linux-amd64#Component — Linux x64 server (updater-managed)" \
            "staging/theia-server-linux-arm64#Component — Linux ARM64 server (updater-managed)" \
            "staging/theia-server-darwin-amd64#Component — macOS Intel server (updater-managed)" \
            "staging/theia-server-darwin-arm64#Component — macOS Apple Silicon server (updater-managed)" \
            "staging/theia-setup-darwin-arm64#DOWNLOAD — Theia ${version} for macOS Apple Silicon" \
            "staging/theia-${version}-darwin-arm64.zip#OFFLINE — Complete macOS Apple Silicon bundle" \
            "staging/theia-player-darwin-arm64.zip#Component — macOS Apple Silicon player bundle (installer-managed)" \
            "staging/theia-launcher-darwin-arm64#Component — macOS Apple Silicon theia command (installer-managed)"
