name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      # web-dist/ holds only its placeholder here, which is enough for
      # //go:embed to resolve. Nothing under test needs the real bundle.
      - run: go vet ./...
      - run: go test ./...

  interface:
    name: Interface guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # The guard drives a real browser against a real binary, because every
      # fault it exists to catch -- an overflowing layout, a refused font, a
      # target too small for a thumb -- renders a page that looks correct.
      - name: Build the binary the guard will drive
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o theia ./cmd/theia

      # Chromium only. The other two engines would triple the download for
      # assertions about geometry that do not differ between them.
      - run: npx playwright install --with-deps chromium
        working-directory: web

      - run: npm test
        working-directory: web

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: interface-guard-failures
          path: web/test-results/
          retention-days: 7

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: '' }
          - { goos: linux, goarch: arm64, ext: '' }
          - { goos: darwin, goarch: amd64, ext: '' }
          - { goos: darwin, goarch: arm64, ext: '' }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # This matrix is the guardrail, not a convenience: every target has to
      # cross-compile from one Linux runner with CGO off. The day a dependency
      # needs cgo, five of these six jobs go red on the commit that added it.
      #
      # TMDB_API_KEY is a repository secret, injected here and never committed.
      # It is empty on pull requests from forks, which GitHub does not expose
      # secrets to -- those builds simply produce a binary with no built-in key,
      # which is a supported state rather than a failure.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_SHA::7} -X main.tmdbAPIKey=${TMDB_API_KEY}" \
            -o "dist/theia-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            ./cmd/theia

      # A key baked into a binary that is then published as a build artifact is
      # a key published. Artifacts are only uploaded when no key went in.
      - name: Check whether the artifact carries a key
        id: keyed
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_API_KEY" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build carries the built-in TMDB key; artifact upload skipped."
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        if: steps.keyed.outputs.upload == 'true'
        with:
          name: theia-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7
