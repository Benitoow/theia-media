[package]
name = "theia-player"
description = "Theia's native player: a Tauri window with an OSD over libmpv."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# `macos-private-api` is not decoration: `tauri.conf.json` declares the window
# `transparent: true`, and on macOS tauri-runtime-wry applies that flag only
# under `any(not(target_os = "macos"), feature = "macos-private-api")`
# (tauri-runtime-wry 2.11.4, src/lib.rs; without the feature it prints a warning
# at startup and draws an opaque window, which is the one thing the OSD cannot be
# over). The matching `app.macOSPrivateApi: true` in `tauri.conf.json` is the
# other half: tauri-utils reads that key to decide whether the feature is
# allowed, and `AppConfig` denies unknown keys, so the reason lives here rather
# than in a JSON file that cannot hold a comment. On Windows the feature is inert.
tauri = { version = "2", features = ["macos-private-api"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No TLS: the server is plain HTTP on the local network and inside the WireGuard
# tunnel, so linking a TLS stack would add a dependency nothing uses.
ureq = { version = "2", default-features = false, features = ["json"] }
mdns-sd = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# The X11 window id mpv is pointed at, and nothing else. A Tauri window on Linux
# is a GTK one, and its portable `raw_window_handle` handle answers `Unavailable`
# (measured on 27 September 2026 in WSLg), so the id is read from GTK's own X11
# window. Both crates are already in the graph through tauri and wry, and are
# pinned to the 0.18 line those two use.
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
